<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persewaan Alat Outdoor</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <div class="header-banner">
      <h1>Persewaan Alat Outdoor</h1>
      <p class="subtitle">Tambah Data Penyewa Baru</p>
    </div>
    <!-- [UBAH J5] hamburger berbasis JS -->
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="main-nav">&#9776;</button>
    <nav id="main-nav">
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../alat/list.html">Data Alat</a></li>
        <li><a href="../alat/tambah.html">Tambah Alat</a></li>
        <li><a href="list.html">Data Penyewa</a></li>
        <li><a href="tambah.html" class="active">Tambah Penyewa</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card-container">
      <h2 class="page-title">Formulir Tambah Penyewa</h2>
      <div class="divider"></div>

      <!-- [UBAH J5] Ditambah id="form-tambah" agar dikenali app.js untuk validasi.
           Tetap tanpa method (default GET). -->
      <form id="form-tambah">
        <div class="form-group">
          <!-- [PERBAIKAN] "ID Penyewa" -> "Kode Penyewa", placeholder PLG003 -> PL005 (PL001-PL004 sudah ada di data)
               agar sama dengan kolom & format kode di tabel (PL001, PL002, PL003) -->
          <label for="kode_penyewa">Kode Penyewa:</label>
          <input type="text" id="kode_penyewa" name="kode_penyewa" class="form-control" placeholder="Contoh: PL005" required>
        </div>

        <div class="form-group">
          <label for="nama_lengkap">Nama Lengkap:</label>
          <input type="text" id="nama_lengkap" name="nama_lengkap" class="form-control" placeholder="Contoh: Rina Wulandari" required>
        </div>

        <div class="form-group">
          <label for="no_hp">No. Telepon / WhatsApp:</label>
          <input type="text" id="no_hp" name="no_hp" class="form-control" placeholder="Contoh: 08123456789" required>
        </div>

        <div class="form-group">
          <label for="alamat">Alamat Lengkap:</label>
          <textarea id="alamat" name="alamat" class="form-control" placeholder="Masukkan alamat lengkap penyewa" required></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Simpan Data</button>
          <button type="reset" class="btn btn-secondary">Batal</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistem Informasi Rental Outdoor</p>
  </footer>

  <!-- [BARU J5] -->
  <script src="../assets/js/app.js"></script>
</body>
</html>
