<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <!-- margin (ruang kosong, garis putus-putus karena bukan kotak sungguhan) -->
  <rect x="20" y="20" width="420" height="420" fill="#f5f6f8" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="40" y="45" font-size="18" font-weight="600" fill="#55677a">margin</text>

  <!-- border -->
  <rect x="60" y="60" width="340" height="340" fill="#1d5b8a"/>
  <text x="80" y="85" font-size="18" font-weight="600" fill="#ffffff">border</text>

  <!-- padding -->
  <rect x="100" y="100" width="260" height="260" fill="#eef4fa"/>
  <text x="120" y="125" font-size="18" font-weight="600" fill="#1d5b8a">padding</text>

  <!-- content -->
  <rect x="150" y="150" width="160" height="160" fill="#ffffff" stroke="#cdd4da" stroke-width="2"/>
  <text x="230" y="235" font-size="18" font-weight="700" fill="#2b2b2b" text-anchor="middle">content</text>

  <!-- garis penunjuk ke keterangan -->
  <line x1="440" y1="38" x2="480" y2="38" stroke="#55677a" stroke-width="2"/>
  <line x1="400" y1="78" x2="480" y2="78" stroke="#55677a" stroke-width="2"/>
  <line x1="360" y1="118" x2="480" y2="118" stroke="#55677a" stroke-width="2"/>
  <line x1="310" y1="230" x2="480" y2="230" stroke="#55677a" stroke-width="2"/>

  <!-- keterangan -->
  <text x="486" y="43" font-size="17" fill="#2b2b2b">jarak ke elemen LAIN di luar kotak</text>
  <text x="486" y="83" font-size="17" fill="#2b2b2b">garis pembatas/bingkai kotak</text>
  <text x="486" y="123" font-size="17" fill="#2b2b2b">jarak dari border ke isi konten</text>
  <text x="486" y="235" font-size="17" fill="#2b2b2b">isi sesungguhnya (teks, gambar)</text>
</svg>
